<body>
  <div id="__bundler_placeholder">Loading 영종 장애인특별운송 안내...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<title>영종 장애인특별운송 안내<\u002Ftitle>\n<script src=\"db3bf105-e11c-428c-97dd-982910b8ea41\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"3600\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap\">\n<style>\nbody{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:#F3F6FB;color:#14213D;font-size:20px;line-height:1.55}\n.card{background:#fff;border:2px solid #C9D3E6;border-radius:20px;padding:24px}\n.btn{min-height:56px;font:inherit;font-weight:700;border-radius:14px;border:2px solid #1B4DB1;cursor:pointer;padding:0 20px}\na{color:#1B4DB1}\na:focus-visible,button:focus-visible,select:focus-visible{outline:4px solid #F59E0B;outline-offset:2px}\nh2{margin:0;font-size:34px;font-weight:900}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;padding:0 20px 60px\" data-canvas-width=\"1280\" data-canvas-height=\"3600\" data-document-role=\"page\" data-label=\"홈페이지\">\n\n<header style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:24px 0\">\n<div style=\"font-size:28px;font-weight:900;color:#1B4DB1\">영종 장애인특별운송<\u002Fdiv>\n<nav style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<a href=\"#now\" style=\"min-height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;text-decoration:none\">지금 버스<\u002Fa>\n<a href=\"#runs\" style=\"min-height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;text-decoration:none\">노선·시간표<\u002Fa>\n<a href=\"#boarding\" style=\"min-height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;text-decoration:none\">타는 곳<\u002Fa>\n<a href=\"#calendar\" style=\"min-height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;text-decoration:none\">운행 달력<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<section id=\"now\" style=\"background:{{accent}};color:#fff;border-radius:28px;padding:40px 36px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-size:22px;font-weight:500\">지금 시각 {{clock}}<\u002Fdiv>\n<div style=\"font-size:48px;font-weight:900;line-height:1.2\">{{heroTitle}}<\u002Fdiv>\n<div style=\"font-size:28px;font-weight:500\">{{heroSub}}<\u002Fdiv>\n<sc-if value=\"{{hasBoard}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:8px;display:flex;flex-wrap:wrap;gap:12px\">\n<div style=\"background:#fff;color:#14213D;border-radius:14px;padding:12px 20px;font-weight:700\">타는 곳: {{heroBoard}}<\u002Fdiv>\n<div style=\"background:#FDE68A;color:#14213D;border-radius:14px;padding:12px 20px;font-weight:900\">버스 오기 10분 전에는 나와 주세요!<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-size:18px;opacity:.95\">※ 정해진 시간표를 기준으로 알려 드려요. 도로 사정에 따라 실제 시간은 달라질 수 있어요.<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"card\" style=\"margin-top:28px;display:flex;flex-direction:column;gap:16px\">\n<h2>내가 타는 정류장 시간 보기<\u002Fh2>\n<label for=\"stopSel\" style=\"font-weight:700\">정류장을 고르세요<\u002Flabel>\n<sc-raw-select id=\"stopSel\" value=\"{{selStop}}\" sc-camel-on-change=\"{{pickStop}}\" style=\"min-height:60px;font:inherit;font-weight:700;border:2px solid #1B4DB1;border-radius:14px;padding:0 16px;background:#fff;color:#14213D\">\n<sc-for list=\"{{stopOpts}}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{o.v}}\">{{o.v}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<sc-for list=\"{{stopTimes}}\" as=\"x\" hint-placeholder-count=\"3\">\n<div style=\"{{x.st}}\">\n<div style=\"font-weight:900;font-size:30px\">{{x.t}}<\u002Fdiv>\n<div style=\"font-weight:700\">{{x.label}} · {{x.dir}}<\u002Fdiv>\n<div style=\"margin-left:auto;font-weight:900;font-size:24px\">{{x.rel}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n\n<section id=\"runs\" style=\"margin-top:44px;display:flex;flex-direction:column;gap:16px\">\n<h2>회차별 노선과 시간표<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"6\">\n<button class=\"btn\" sc-camel-on-click=\"{{ t.pick }}\" style=\"{{t.st}}\">{{t.n}}회차<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"card\">\n<div style=\"font-size:30px;font-weight:900\">{{runN}}회차 · {{runDir}}<\u002Fdiv>\n<div style=\"font-weight:700;margin:4px 0 16px\">{{runStart}} 복지관 출발 → {{runEnd}} 복지관 도착<\u002Fdiv>\n<sc-for list=\"{{runStops}}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"{{s.st}}\">\n<div style=\"width:90px;font-weight:900;font-size:24px\">{{s.t}}<\u002Fdiv>\n<div style=\"font-weight:500\">{{s.name}}<\u002Fdiv>\n<div style=\"margin-left:auto;font-weight:900;color:#B45309\">{{s.tag}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"boarding\" style=\"margin-top:44px;display:flex;flex-direction:column;gap:16px\">\n<h2>복지관에서 타는 곳<\u002Fh2>\n<div style=\"font-weight:500\">회차마다 타는 곳이 달라요. 지도에서 내 회차의 주황색 표시를 꼭 확인하세요.<\u002Fdiv>\n<div class=\"card\" style=\"padding:12px;display:flex;flex-direction:column;gap:12px\">\n<img src=\"f4f24884-2103-431d-b466-876a530ca331\" alt=\"영종복합문화센터 주변 지도. 2회차는 큰길 오른쪽 정류장, 4회차부터 6회차는 큰길 왼쪽 정류장, 3회차는 큰길 아래쪽 오른편에서 출발\" style=\"width:100%;height:auto;display:block;border-radius:12px\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px\">\n<div style=\"background:#FFF1E6;border:2px solid #C2410C;border-radius:14px;padding:12px 16px;font-weight:900\">2회차 · 11:00<div style=\"font-weight:500\">큰길 오른쪽 정류장<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#FFF1E6;border:2px solid #C2410C;border-radius:14px;padding:12px 16px;font-weight:900\">3회차 · 13:00<div style=\"font-weight:500\">큰길 아래쪽, 게이트볼장 앞<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#FFF1E6;border:2px solid #C2410C;border-radius:14px;padding:12px 16px;font-weight:900\">4~6회차 · 14:10 / 15:20 / 16:30<div style=\"font-weight:500\">큰길 왼쪽 정류장 (영종온누리교회 앞)<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n<sc-for list=\"{{runs}}\" as=\"r\" hint-placeholder-count=\"6\">\n<div class=\"card\" style=\"display:flex;flex-direction:column;gap:6px\">\n<div style=\"font-size:28px;font-weight:900;color:#1B4DB1\">{{r.n}}회차 · {{r.start}} 출발<\u002Fdiv>\n<div style=\"font-weight:700\">{{r.dir}}<\u002Fdiv>\n<div style=\"background:#EAF0FB;border-radius:12px;padding:12px 14px;font-weight:900\">타는 곳: {{r.board}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-weight:700;color:#B42318\">휠체어를 이용하실 분은 타기 전에 복지관으로 먼저 전화해 주세요.<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"calendar\" style=\"margin-top:44px;display:flex;flex-direction:column;gap:16px\">\n<h2>운행 달력<\u002Fh2>\n<div class=\"card\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px\">\n<button class=\"btn\" sc-camel-on-click=\"{{prevM}}\" aria-label=\"지난달\" style=\"background:#fff;color:#1B4DB1;min-width:72px\">◀ 이전<\u002Fbutton>\n<div style=\"font-size:30px;font-weight:900\">{{monthLabel}}<\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{nextM}}\" aria-label=\"다음달\" style=\"background:#fff;color:#1B4DB1;min-width:72px\">다음 ▶<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-weight:900;margin-bottom:6px\">\n<div style=\"color:#B42318\">일<\u002Fdiv><div>월<\u002Fdiv><div>화<\u002Fdiv><div>수<\u002Fdiv><div>목<\u002Fdiv><div>금<\u002Fdiv><div style=\"color:#1B4DB1\">토<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px\">\n<sc-for list=\"{{cells}}\" as=\"c\" hint-placeholder-count=\"14\">\n<sc-if value=\"{{c.blank}}\" hint-placeholder-val=\"{{ false }}\"><div><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{c.real}}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{c.pick}}\" style=\"{{c.st}}\"><span style=\"font-size:24px;font-weight:900\">{{c.d}}<\u002Fspan><span style=\"font-size:15px;font-weight:700\">{{c.tag}}<\u002Fspan><\u002Fbutton><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:12px;font-size:18px;font-weight:500\">흰 칸은 운행하는 날, 회색 칸은 운행하지 않는 날이에요. (토요일·일요일·공휴일 쉼)<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-size:30px;font-weight:900\">{{selTitle}}<\u002Fdiv>\n<div style=\"font-weight:700\">{{selSub}}<\u002Fdiv>\n<sc-for list=\"{{selRuns}}\" as=\"q\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;border-top:1px solid #D7DEEC;padding-top:8px\"><b style=\"min-width:70px\">{{q.n}}회차<\u002Fb><span style=\"font-weight:900\">{{q.start}} ~ {{q.end}}<\u002Fspan><span>{{q.dir}}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer id=\"contact\" style=\"margin-top:44px;background:#14213D;color:#fff;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-size:32px;font-weight:900\">문의 전화<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<a href=\"tel:01077872433\" style=\"min-height:64px;padding:0 28px;display:flex;align-items:center;background:#FDE68A;color:#14213D;border-radius:16px;font-weight:900;font-size:26px;text-decoration:none\">010-7787-2433<\u002Fa>\n<a href=\"tel:0327522433\" style=\"min-height:64px;padding:0 28px;display:flex;align-items:center;background:#fff;color:#14213D;border-radius:16px;font-weight:900;font-size:26px;text-decoration:none\">032-752-2433<\u002Fa>\n<\u002Fdiv>\n<div style=\"font-size:18px\">도로 상황에 따라 정차 시간이 다를 수 있어요 · 토요일과 휴일은 운행하지 않아요<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1B4DB1&quot;,&quot;options&quot;:[&quot;#1B4DB1&quot;,&quot;#0F5E4D&quot;,&quot;#7A2E8E&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3600}}\">\nclass Component extends DCLogic {\ncomponentDidMount(){ this._t=setInterval(()=>this.forceUpdate(),30000); }\ncomponentWillUnmount(){ clearInterval(this._t); }\nrenderVals(){\nconst S=this.state||{};\nconst acc=this.props.accent??'#1B4DB1';\nconst pad=n=>String(n).padStart(2,'0');\nconst K=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));\nconst Y=K.getFullYear(),M=K.getMonth(),D=K.getDate();\nconst key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);\nconst H=new Set('2026-01-01,2026-02-16,2026-02-17,2026-02-18,2026-03-02,2026-05-01,2026-05-05,2026-05-25,2026-06-03,2026-08-17,2026-09-24,2026-09-25,2026-09-26,2026-10-05,2026-10-09,2026-12-25'.split(','));\nconst X={'2026-08-03':'기사 휴무','2026-09-23':'기사 휴무','2026-09-28':'기사 휴무','2026-10-20':'차량 점검','2026-10-30':'기관 내부사정','2026-11-18':'기관 내부사정'};/* 복지관 자체 휴무일: '2026-10-27':'복지관 휴무' 처럼 한 줄씩 추가 */\nconst isOp=(y,m,d)=>{const w=new Date(y,m,d).getDay();return w>0&&w<6&&!H.has(key(y,m,d))&&!X[key(y,m,d)];};\nconst DN=['일','월','화','수','목','금','토'];\nconst mins=t=>{const a=t.split(':');return +a[0]*60+ +a[1];};\nconst fmt=m=>m>=60?Math.floor(m/60)+'시간 '+(m%60?m%60+'분':''):m+'분';\nconst PH='복지관 앞 [탑승 위치 입력]';\nconst RAW=[\n[1,'이편한세상 → 풍림 방면','08:30','복지관 앞 [탑승 위치 입력]','KCC스위첸.한양 08:44;e편한센텀베뉴정문 08:46;우미린2단지정문 08:48;신명스카이뷰정문 08:50;동보노빌리티 08:52;e편한오션하임 08:56;LH49단지행복주택 08:57;중산고등학교 09:05;중산중학교 09:06;호반써밋1차 09:07;영종하늘도서관 09:08;화성후문.한라비발디 09:10;화성.스카이자이 09:11;서한이다음정문 09:13;서희스타힐스정문(우미1단지후문) 09:15;e편한세상영종 09:25;푸르지오256동 09:27;금호어울림2차(세차장 앞) 09:29;넙디마을입구 09:31;금강펜테리움 09:33;운서2동 행정복지센터(구 은골공원) 09:37;은골사거리 09:39;영종도서관 09:41;풍림1차205동 09:45;복지관 도착 10:00'],\n[2,'풍림 → 이편한세상 방면','11:00','지도의 2회차 위치 (큰길 오른쪽 정류장)','중산중학교 11:10;호반써밋1차 11:11;영종하늘도서관 11:12;화성후문.한라비발디 11:14;화성.스카이자이 11:15;서한이다음정문 11:17;서희스타힐스정문(우미1단지후문) 11:19;풍림1차205동 11:35;영종도서관 11:38;공항신도시(메디컬) 11:40;운서2동 행정복지센터(구 은골공원) 11:43;영종LH2단지 11:45;영종LH입구 11:47;금호어울림2차(SK주유소 앞) 11:49;푸르지오256동 11:51;e편한세상영종 11:54;복지관 도착 12:00'],\n[3,'이편한세상 → 풍림 방면','13:00','지도의 3회차 위치 (게이트볼장 앞)','LH7단지 13:06;센텀베뉴.화성2차 13:07;센텀베뉴.푸자 13:09;센텀베뉴정문 13:11;우미린2단지정문 13:13;신명스카이뷰정문 13:15;동보노빌리티 13:17;e편한오션하임 13:21;LH49단지행복주택 13:22;중산고등학교 13:28;중산중학교 13:29;호반써밋1차 13:30;영종하늘도서관 13:31;화성후문.한라비발디 13:33;화성.스카이자이 13:34;서한이다음정문 13:36;서희스타힐스정문(우미1단지후문) 13:38;중산동(중촌) 13:43;관창마을 13:46;전소 13:48;물류고등학교앞 13:52;복지관 도착 14:00'],\n[4,'이편한세상 → 풍림 방면','14:10','지도의 4~6회차 위치 (큰길 왼쪽 정류장)','e편한세상영종 14:15;푸르지오256동 14:17;금호어울림2차(세차장 앞) 14:19;넙디마을입구 14:21;금강펜테리움 14:23;운서2동 행정복지센터(구 은골공원) 14:27;은골사거리 14:29;영종도서관 14:31;풍림1차205동 14:35;복지관 도착 14:50'],\n[5,'풍림 → 이편한세상 방면','15:20','지도의 4~6회차 위치 (큰길 왼쪽 정류장)','LH7단지 15:26;센텀베뉴.화성2차 15:27;센텀베뉴.푸자 15:29;센텀베뉴정문 15:31;우미린2단지정문 15:33;신명스카이뷰정문 15:35;동보노빌리티 15:37;e편한오션하임 15:41;LH49단지행복주택 15:42;중산고등학교 15:48;중산중학교 15:49;호반써밋1차 15:50;영종하늘도서관 15:51;화성후문.한라비발디 15:53;화성.스카이자이 15:54;서한이다음정문 15:56;서희스타힐스정문(우미1단지후문) 15:58;중산동(중촌) 16:03;관창마을 16:06;전소 16:08;물류고등학교앞 16:12;복지관 도착 16:20'],\n[6,'풍림 → 이편한세상 방면','16:30','지도의 4~6회차 위치 (큰길 왼쪽 정류장)','풍림1차205동 16:45;영종도서관 16:48;공항신도시(메디컬) 16:51;운서2동 행정복지센터(구 은골공원) 16:54;영종LH2단지 16:56;영종LH입구 16:58;금호어울림2차(SK주유소 앞) 17:00;푸르지오256동 17:02;e편한세상영종 17:05;복지관 도착 17:10']\n];\nconst runs=RAW.map(r=>{const st=r[4].split(';').map(x=>{const i=x.lastIndexOf(' ');return {name:x.slice(0,i),t:x.slice(i+1)};});st.unshift({name:'복지관 출발',t:r[2]});return {n:r[0],dir:r[1],start:r[2],board:r[3],stops:st,end:st[st.length-1].t};});\nconst nm=K.getHours()*60+K.getMinutes();\nconst op=isOp(Y,M,D);\nconst nextDay=()=>{for(let i=1;i<12;i++){const d=new Date(Y,M,D+i);if(isOp(d.getFullYear(),d.getMonth(),d.getDate()))return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DN[d.getDay()]+') 첫차 08:30';}return '';};\nlet heroTitle,heroSub,heroBoard='',hasBoard=false,heroRun=1;\nconst act=op?runs.find(r=>nm>=mins(r.start)&&nm<=mins(r.end)):null;\nconst up=op?runs.find(r=>mins(r.start)>nm):null;\nif(act){const ns=act.stops.find(s=>mins(s.t)>=nm);heroRun=act.n;heroTitle=act.n+'회차 버스가 운행 중이에요';heroSub='다음 정차 예정: '+ns.name+' '+ns.t;heroBoard=act.board;hasBoard=true;}\nelse if(up){heroRun=up.n;heroTitle='다음 버스는 '+up.n+'회차예요';heroSub=up.start+' 복지관 출발 · '+fmt(mins(up.start)-nm)+' 뒤';heroBoard=up.board;hasBoard=true;}\nelse{heroTitle=op?'오늘 운행이 모두 끝났어요':'오늘은 운행하지 않는 날이에요';heroSub='다음 운행: '+nextDay();}\nconst names=[];runs.forEach(r=>r.stops.forEach(s=>{if(s.name!=='복지관 출발'&&s.name!=='복지관 도착'&&!names.includes(s.name))names.push(s.name);}));\nconst selStop=S.stop||names.includes('e편한세상영종')?(S.stop||'e편한세상영종'):names[0];\nlet hit=false;\nconst stopTimes=[];\nruns.forEach(r=>r.stops.forEach(s=>{if(s.name===selStop){const diff=mins(s.t)-nm;let rel='평일 운행',hl=false;if(op){if(diff>=0){rel=diff===0?'지금 도착':fmt(diff)+' 뒤';if(!hit){hit=true;hl=true;}}else rel='지나갔어요';}\nstopTimes.push({t:s.t,label:r.n+'회차',dir:r.dir,rel,st:'display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-radius:14px;padding:14px 18px;'+(hl?'background:#FDE68A;border:3px solid #B45309':'background:#F3F6FB;border:2px solid #D7DEEC')});}}));\nconst tabsSel=S.run||heroRun;\nconst tabs=runs.map(r=>({n:r.n,pick:()=>this.setState({run:r.n}),st:r.n===tabsSel?'background:'+acc+';color:#fff':'background:#fff;color:#1B4DB1'}));\nconst cr=runs[tabsSel-1];\nconst crAct=op&&nm>=mins(cr.start)&&nm<=mins(cr.end);\nlet nxt=crAct?cr.stops.findIndex(s=>mins(s.t)>=nm):-1;\nconst runStops=cr.stops.map((s,i)=>({t:s.t,name:s.name,tag:i===nxt?'다음 정차':'',st:'display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #E3E8F2;'+(i===nxt?'background:#FDE68A;border-radius:10px;':'')+((i===0||i===cr.stops.length-1)?'font-weight:900;color:#0F5E4D;':'')}));\nconst vy=S.vy??Y,vm=S.vm??M,sd=S.sd??key(Y,M,D);\nconst first=new Date(vy,vm,1).getDay(),dim=new Date(vy,vm+1,0).getDate();\nconst cells=[];\nfor(let i=0;i<first;i++)cells.push({blank:true,real:false});\nfor(let d=1;d<=dim;d++){const k=key(vy,vm,d),o=isOp(vy,vm,d),sel=k===sd,td=k===key(Y,M,D);\ncells.push({blank:false,real:true,d,tag:o?'운행':'쉼',pick:()=>this.setState({sd:k}),\nst:'min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-family:inherit;cursor:pointer;border:'+(td?'4px solid #B45309':'2px solid #C9D3E6')+';'+(sel?'background:'+acc+';color:#fff;':(o?'background:#fff;color:#14213D;':'background:#E5E7EB;color:#4B5563;'))});}\nconst sp=sd.split('-').map(Number),sdt=new Date(sp[0],sp[1]-1,sp[2]),sop=isOp(sp[0],sp[1]-1,sp[2]);\nconst prevM=()=>{let m=vm-1,y=vy;if(m<0){m=11;y--;}this.setState({vy:y,vm:m});};\nconst nextM=()=>{let m=vm+1,y=vy;if(m>11){m=0;y++;}this.setState({vy:y,vm:m});};\nreturn {accent:acc,clock:pad(K.getHours())+':'+pad(K.getMinutes()),heroTitle,heroSub,heroBoard,hasBoard,\nstopOpts:names.map(v=>({v})),selStop,pickStop:e=>this.setState({stop:e.target.value}),stopTimes,\ntabs,runN:cr.n,runDir:cr.dir,runStart:cr.start,runEnd:cr.end,runStops,runs,\nmonthLabel:vy+'년 '+(vm+1)+'월',cells,prevM,nextM,\nselTitle:(sp[1])+'월 '+sp[2]+'일 ('+DN[sdt.getDay()]+')',\nselSub:sop?'이날은 하루 6회 운행해요.':'이날은 운행하지 않아요. ('+(X[sd]||'토요일·일요일·공휴일')+')',\nselRuns:sop?runs.map(r=>({n:r.n,start:r.start,end:r.end,dir:r.dir})):[]};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
